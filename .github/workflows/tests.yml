name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('contrastive-pretraining/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contrastive-pretraining/requirements.txt
          pip install -e contrastive-pretraining/mr_rate/ -e contrastive-pretraining/vision_encoder/

      - name: Run tests with coverage
        run: |
          python -m pytest --cov-report=xml
        working-directory: contrastive-pretraining

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: contrastive-pretraining/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dino-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MR DINO test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dino-pretraining/requirements.txt pytest
          git clone --filter=blob:none https://github.com/facebookresearch/dinov3.git "$RUNNER_TEMP/dinov3"
          git -C "$RUNNER_TEMP/dinov3" checkout 6876159a11b4df116f30f667f8c9888617df0751

      - name: Run synthetic MR DINO integration tests
        working-directory: dino-pretraining
        env:
          PYTHONPATH: ${{ runner.temp }}/dinov3
        run: python -m pytest -q
